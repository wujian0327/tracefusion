# Trace-fusion TrainTicket preserve-path Kubernetes deployment.
#
# This manifest mirrors services/train-ticket/docker-compose.yml:
# - Keeps only the services needed by the preserve benchmark path.
# - Uses service names identical to docker compose, so the original
#   TrainTicket Spring configuration can resolve peer services by DNS.
# - Loads the X-Mark propagation override from a ConfigMap named
#   xmark-propagation-jar.
#
# Create the ConfigMap before applying this file:
#   services/train-ticket/overrides/xmark-propagation/build.sh
#   kubectl create namespace train-ticket --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n train-ticket create configmap xmark-propagation-jar \
#     --from-file=xmark-propagation.jar=services/train-ticket/overrides/xmark-propagation/build/xmark-propagation.jar \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: train-ticket
---
apiVersion: v1
kind: Service
metadata:
  name: ts-auth-mongo
  namespace: train-ticket
  labels:
    app: ts-auth-mongo
spec:
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
  selector:
    app: ts-auth-mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-auth-mongo
  namespace: train-ticket
  labels:
    app: ts-auth-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-auth-mongo
  template:
    metadata:
      labels:
        app: ts-auth-mongo
    spec:
      containers:
      - name: mongo
        image: docker.io/library/mongo:4.4
        imagePullPolicy: Never
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: ts-auth-service
  namespace: train-ticket
  labels:
    app: ts-auth-service
    service: ts-auth-service
spec:
  type: NodePort
  ports:
  - name: http
    port: 12340
    targetPort: 12340
    nodePort: 31340
  selector:
    app: ts-auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-auth-service
  namespace: train-ticket
  labels:
    app: ts-auth-service
    service: ts-auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-auth-service
  template:
    metadata:
      labels:
        app: ts-auth-service
        service: ts-auth-service
    spec:
      containers:
      - name: ts-auth-service
        image: docker.io/codewisdom/ts-auth-service:0.2.0
        imagePullPolicy: Never
        command: ["java"]
        args: ["-Xmx200m", "-Dloader.path=/xmark", "-cp", "/app/ts-auth-service-1.0.jar", "org.springframework.boot.loader.PropertiesLauncher"]
        ports:
        - containerPort: 12340
        volumeMounts:
        - name: xmark-propagation
          mountPath: /xmark/xmark-propagation.jar
          subPath: xmark-propagation.jar
          readOnly: true
      volumes:
      - name: xmark-propagation
        configMap:
          name: xmark-propagation-jar
