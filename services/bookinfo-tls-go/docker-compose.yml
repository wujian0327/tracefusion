services:
  details:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: trace-fusion-bookinfo-tls-go:latest
    container_name: bookinfo-tls-go-details
    environment:
      SERVICE_ROLE: details
      BOOK_COUNT: 100
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: "*"
    ports:
      - "9461:9080"

  ratings:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: trace-fusion-bookinfo-tls-go:latest
    container_name: bookinfo-tls-go-ratings
    environment:
      SERVICE_ROLE: ratings
      BOOK_COUNT: 100
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: "*"
    ports:
      - "9462:9080"

  reviews:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: trace-fusion-bookinfo-tls-go:latest
    container_name: bookinfo-tls-go-reviews
    environment:
      SERVICE_ROLE: reviews
      RATINGS_HOSTNAME: ratings
      RATINGS_SERVICE_PORT: 9080
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: "*"
    depends_on:
      - ratings
    ports:
      - "9463:9080"

  productpage:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: trace-fusion-bookinfo-tls-go:latest
    container_name: bookinfo-tls-go-productpage
    environment:
      SERVICE_ROLE: productpage
      BOOK_COUNT: 100
      DETAILS_HOSTNAME: details
      DETAILS_SERVICE_PORT: 9080
      REVIEWS_HOSTNAME: reviews
      REVIEWS_SERVICE_PORT: 9080
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: "*"
    depends_on:
      - details
      - reviews
    ports:
      - "9460:9080"
